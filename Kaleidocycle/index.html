<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      if (new URLSearchParams(window.location.search).get("embedded") === "1") {
        document.documentElement.classList.add("is-embedded");
      }
    </script>
    <!-- Local minified production runtime: no network request is required. -->
    <script src="p5.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
    </main>
    <script src="js/config.js"></script>
    <script src="js/math3d.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/surfaces.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/sketch.js"></script>
    <script>
      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;
        if (event.data?.type === "kaleidocycle-mode") {
          setKaleidocyclePerformanceMode(event.data.mode);
        } else if (event.data?.type === "kaleidocycle-toggle-pause") {
          toggleKaleidocycleAnimation();
        }
      });
    </script>
  </body>
</html>

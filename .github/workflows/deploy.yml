name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout private CV template
        uses: actions/checkout@v4
        with:
          repository: hamedeo/cv-template-private
          token: ${{ secrets.CV_TEMPLATE_TOKEN }}
          path: private-cv-template
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install personal website dependencies
        run: npm ci

      - name: Restore generated CV
        id: cv-cache
        uses: actions/cache@v5
        with:
          path: public/downloads/Hamed_Abdollahi-CV.pdf
          key: ${{ format('cv-pdf-{0}-{1}', runner.os, hashFiles('src/content/cv.md', 'src/content/bio.md', 'src/pages/cv/**', 'src/components/ui/Timeline.astro', 'src/layouts/BaseLayout.astro', 'src/content.config.ts', 'src/config/**', 'src/styles/global.css', 'scripts/generate-cv.mjs', 'private-cv-template/**/*.docx', 'package.json', 'package-lock.json')) }}

      - name: Validate private CV template
        if: steps.cv-cache.outputs.cache-hit != 'true'
        env:
          CV_TEMPLATE_PATH: ${{ github.workspace }}/private-cv-template/Hamed_Abdollahi-CVtemp.docx
        run: |
          set -euo pipefail

          if [ ! -f "$CV_TEMPLATE_PATH" ]; then
            echo "Error: private CV template was not found at the expected path." >&2
            exit 1
          fi

          if head -c 4096 "$CV_TEMPLATE_PATH" | grep -aEiq '<!doctype html|<html|<head|<body'; then
            echo "Error: private CV template is HTML, not a DOCX file." >&2
            exit 1
          fi

          signature="$(head -c 4 "$CV_TEMPLATE_PATH" | od -An -tx1 | tr -d '[:space:]')"
          if [ "$signature" != "504b0304" ]; then
            echo "Error: private CV template does not have a valid DOCX/ZIP signature." >&2
            exit 1
          fi

          if ! unzip -tqq "$CV_TEMPLATE_PATH" >/dev/null 2>&1; then
            echo "Error: private CV template is not a valid ZIP archive." >&2
            exit 1
          fi

          entries="$(unzip -Z1 "$CV_TEMPLATE_PATH")"
          if ! printf '%s\n' "$entries" | grep -Fxq '[Content_Types].xml' || \
             ! printf '%s\n' "$entries" | grep -Fxq 'word/document.xml'; then
            echo "Error: private CV template is a ZIP file, but not a valid DOCX document." >&2
            exit 1
          fi

      - name: Generate temporary CV DOCX
        if: steps.cv-cache.outputs.cache-hit != 'true'
        env:
          CV_TEMPLATE_PATH: ${{ github.workspace }}/private-cv-template/Hamed_Abdollahi-CVtemp.docx
          CV_DOCX_OUTPUT: ${{ runner.temp }}/cv/Hamed_Abdollahi-CV.docx
        run: npm run generate:cv

      - name: Install LibreOffice Writer
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libreoffice-writer-nogui \
              fontconfig

      - name: Convert CV to PDF
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p public/downloads

          libreoffice \
            -env:UserInstallation=file:///tmp/libreoffice-profile \
            --headless \
            --convert-to pdf:writer_pdf_Export \
            --outdir public/downloads \
            "${{ runner.temp }}/cv/Hamed_Abdollahi-CV.docx"

          test -s public/downloads/Hamed_Abdollahi-CV.pdf

      - name: Verify generated CV PDF
        run: |
          test -s public/downloads/Hamed_Abdollahi-CV.pdf
          signature="$(head -c 5 public/downloads/Hamed_Abdollahi-CV.pdf)"
          if [ "$signature" != "%PDF-" ]; then
            echo "Error: generated or restored CV is not a valid PDF." >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        run: npm run build:site

      - name: Verify personal website output
        run: |
          test -f dist/index.html
          test -s dist/downloads/Hamed_Abdollahi-CV.pdf
          test -f dist/.well-known/r3ply/config.toml
          test ! -e dist/Morpheidos_Tech

          if grep -RFn 'https://hamedeo.github.io/Morpheidos_Tech' dist; then
            echo "Error: personal output contains the old company deployment URL." >&2
            exit 1
          fi

          if grep -RFn '/Morpheidos_Tech/' dist; then
            echo "Error: personal output contains the obsolete company route." >&2
            exit 1
          fi

          grep -Fq '<link rel="canonical" href="https://hamed.morpheidos.tech/' dist/index.html
          grep -Fq '<meta property="og:url" content="https://hamed.morpheidos.tech/' dist/index.html
          grep -Fq '<meta property="twitter:url" content="https://hamed.morpheidos.tech/' dist/index.html
          grep -RFq --include='*.html' 'https://morpheidos.tech' dist

          metadata_pages=0
          while IFS= read -r -d '' page; do
            canonical_url="$(grep -oP '<link rel="canonical" href="\K[^"]+' "$page" | head -n 1)"
            og_url="$(grep -oP '<meta property="og:url" content="\K[^"]+' "$page" | head -n 1)"
            twitter_url="$(grep -oP '<meta property="twitter:url" content="\K[^"]+' "$page" | head -n 1)"
            og_image="$(grep -oP '<meta property="og:image" content="\K[^"]+' "$page" | head -n 1)"
            twitter_image="$(grep -oP '<meta property="twitter:image" content="\K[^"]+' "$page" | head -n 1)"

            if [[ "$canonical_url" != https://hamed.morpheidos.tech/* ]] || \
               [ "$og_url" != "$canonical_url" ] || \
               [ "$twitter_url" != "$canonical_url" ] || \
               [[ "$og_image" != https://hamed.morpheidos.tech/* ]] || \
               [[ "$twitter_image" != https://hamed.morpheidos.tech/* ]]; then
              echo "Error: canonical or social metadata is invalid in $page." >&2
              exit 1
            fi

            metadata_pages=$((metadata_pages + 1))
          done < <(grep -rlZ --include='*.html' '<meta name="generator" content="Astro ' dist)
          test "$metadata_pages" -gt 0

          grep -Fq 'Sitemap: https://hamed.morpheidos.tech/sitemap-index.xml' dist/robots.txt
          test -f dist/sitemap-index.xml

          if grep -RFn 'https://hamedeo.github.io' dist/sitemap*.xml; then
            echo "Error: sitemap contains the non-canonical hostname." >&2
            exit 1
          fi

          grep -RFq 'https://hamed.morpheidos.tech/' dist/sitemap*.xml
          ls -lh dist/index.html
          ls -lh dist/downloads

      - name: Upload personal website artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-site
          path: dist
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download personal website artifact
        uses: actions/download-artifact@v4
        with:
          name: personal-site
          path: dist

      - name: Verify downloaded personal website
        run: |
          test -f dist/index.html
          test -f dist/.well-known/r3ply/config.toml
          test ! -e dist/Morpheidos_Tech

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamedeo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout private CV template
        uses: actions/checkout@v4
        with:
          repository: hamedeo/cv-template-private
          token: ${{ secrets.CV_TEMPLATE_TOKEN }}
          path: .private
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Generate temporary CV DOCX
        env:
          CV_TEMPLATE_PATH: ${{ github.workspace }}/.private/Hamed_Abdollahi-CVtemp.docx
          CV_DOCX_OUTPUT: ${{ runner.temp }}/cv/Hamed_Abdollahi-CV.docx
        run: npm run generate:cv

      - name: Install LibreOffice Writer
        run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libreoffice-writer-nogui \
              fontconfig

      - name: Convert CV to PDF
        run: |
          mkdir -p public/downloads

          libreoffice \
            -env:UserInstallation=file:///tmp/libreoffice-profile \
            --headless \
            --convert-to pdf:writer_pdf_Export \
            --outdir public/downloads \
            "${{ runner.temp }}/cv/Hamed_Abdollahi-CV.docx"

          test -s public/downloads/Hamed_Abdollahi-CV.pdf

      - name: Build with Astro
        run: npm run build:site

      - name: Verify generated files
        run: |
          test -s dist/downloads/Hamed_Abdollahi-CV.pdf
          test -f dist/.well-known/r3ply/config.toml
          ls -lh dist/downloads

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamedeo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
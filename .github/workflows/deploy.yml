name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout private CV template
        uses: actions/checkout@v4
        with:
          repository: hamedeo/cv-template-private
          token: ${{ secrets.CV_TEMPLATE_TOKEN }}
          path: private-cv-template
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore generated CV
        id: cv-cache
        uses: actions/cache@v5
        with:
          path: public/downloads/Hamed_Abdollahi-CV.pdf
          key: ${{ format('cv-pdf-{0}-{1}', runner.os, hashFiles('src/content/cv.md', 'src/content/bio.md', 'src/pages/cv/**', 'src/components/ui/Timeline.astro', 'src/layouts/BaseLayout.astro', 'src/content.config.ts', 'src/config/**', 'src/styles/global.css', 'scripts/generate-cv.mjs', 'private-cv-template/**/*.docx', 'package.json', 'package-lock.json')) }}

      - name: Validate private CV template
        if: steps.cv-cache.outputs.cache-hit != 'true'
        env:
          CV_TEMPLATE_PATH: ${{ github.workspace }}/private-cv-template/Hamed_Abdollahi-CVtemp.docx
        run: |
          set -euo pipefail

          if [ ! -f "$CV_TEMPLATE_PATH" ]; then
            echo "Error: private CV template was not found at the expected path." >&2
            exit 1
          fi

          if head -c 4096 "$CV_TEMPLATE_PATH" | grep -aEiq '<!doctype html|<html|<head|<body'; then
            echo "Error: private CV template is HTML, not a DOCX file." >&2
            exit 1
          fi

          signature="$(head -c 4 "$CV_TEMPLATE_PATH" | od -An -tx1 | tr -d '[:space:]')"
          if [ "$signature" != "504b0304" ]; then
            echo "Error: private CV template does not have a valid DOCX/ZIP signature." >&2
            exit 1
          fi

          if ! unzip -tqq "$CV_TEMPLATE_PATH" >/dev/null 2>&1; then
            echo "Error: private CV template is not a valid ZIP archive." >&2
            exit 1
          fi

          entries="$(unzip -Z1 "$CV_TEMPLATE_PATH")"
          if ! printf '%s\n' "$entries" | grep -Fxq '[Content_Types].xml' || \
             ! printf '%s\n' "$entries" | grep -Fxq 'word/document.xml'; then
            echo "Error: private CV template is a ZIP file, but not a valid DOCX document." >&2
            exit 1
          fi

      - name: Generate temporary CV DOCX
        if: steps.cv-cache.outputs.cache-hit != 'true'
        env:
          CV_TEMPLATE_PATH: ${{ github.workspace }}/private-cv-template/Hamed_Abdollahi-CVtemp.docx
          CV_DOCX_OUTPUT: ${{ runner.temp }}/cv/Hamed_Abdollahi-CV.docx
        run: npm run generate:cv

      - name: Install LibreOffice Writer
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libreoffice-writer-nogui \
              fontconfig

      - name: Convert CV to PDF
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p public/downloads

          libreoffice \
            -env:UserInstallation=file:///tmp/libreoffice-profile \
            --headless \
            --convert-to pdf:writer_pdf_Export \
            --outdir public/downloads \
            "${{ runner.temp }}/cv/Hamed_Abdollahi-CV.docx"

          test -s public/downloads/Hamed_Abdollahi-CV.pdf

      - name: Verify generated CV PDF
        run: |
          test -s public/downloads/Hamed_Abdollahi-CV.pdf
          signature="$(head -c 5 public/downloads/Hamed_Abdollahi-CV.pdf)"
          if [ "$signature" != "%PDF-" ]; then
            echo "Error: generated or restored CV is not a valid PDF." >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        run: npm run build:site

      - name: Verify generated files
        run: |
          test -s dist/downloads/Hamed_Abdollahi-CV.pdf
          test -f dist/.well-known/r3ply/config.toml
          ls -lh dist/downloads

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamedeo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
